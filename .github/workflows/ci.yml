name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          poetry install --with dev

      - name: Run unit tests
        run: poetry run python -m unittest discover -s services/authz/tests -t .

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t authz-service:ci .

      - name: Run container
        run: |
          docker run -d --name authz-ci -p 8080:8080 authz-service:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then
              echo "authz-service is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "authz-service did not become healthy in time"
          exit 1

      - name: Smoke test /v1/authorize (unknown principal -> DENY, not an error)
        run: |
          curl -sf -X POST http://localhost:8080/v1/authorize \
            -H 'content-type: application/json' \
            -d '{"identity":{"subject":"arn:aws:iam::000000000000:role/nobody","auth_type":"aws_iam"},"action":"llm.invoke"}' \
            | grep -q '"decision":"DENY"'

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs authz-ci

      - name: Stop container
        if: always()
        run: docker rm -f authz-ci

  # Plan section 35.9 (P2 production hardening) -- same reasoning as
  # bedrock-gateway-app's own copy of these jobs: NOT in deploy-dev's
  # `needs:`, findings land in the Security tab, a severity threshold
  # becoming deploy-blocking is a deliberate follow-up.
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # CodeQL's diff-informed-queries feature calls GET on the
      # current workflow run (docs.github.com/rest/actions/
      # workflow-runs#get-a-workflow-run, under the Actions API) even
      # on a plain push trigger, not just pull_request -- without
      # this the analyze step still produces a valid SARIF but then
      # fails the job with "Resource not accessible by integration"
      # trying to fetch that run's context afterward. Live-verified.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  pip-audit:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          # Poetry 2.0 stopped bundling `export` -- it's an optional
          # plugin now, not built in. Without this, `poetry export`
          # below fails immediately with "The requested command
          # export does not exist." Live-verified in CI.
          poetry self add poetry-plugin-export
          poetry install --with dev
      - name: Export requirements from poetry.lock
        run: poetry export --with dev -f requirements.txt -o requirements-audit.txt --without-hashes
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements-audit.txt --desc

  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t authz-service:trivy-scan .
      # v0.28.0, not 0.28.0 -- this action's tags are v-prefixed;
      # the bare-version form doesn't resolve. Live-verified in CI
      # ("unable to find version `0.28.0`").
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: authz-service:trivy-scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy-dev:
    name: Deploy to dev
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_AUTHZ_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev-authz
          ecs-cluster: gateway-dev-authz-cluster
          ecs-service: gateway-dev-authz-service
          task-definition-family: gateway-dev-authz
