name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          poetry install --with dev

      - name: Run unit tests
        run: poetry run python -m unittest discover -s services/authz/tests -t .

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t authz-service:ci .

      - name: Run container
        run: |
          docker run -d --name authz-ci -p 8080:8080 authz-service:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then
              echo "authz-service is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "authz-service did not become healthy in time"
          exit 1

      - name: Smoke test /v1/authorize (unknown principal -> DENY, not an error)
        run: |
          curl -sf -X POST http://localhost:8080/v1/authorize \
            -H 'content-type: application/json' \
            -d '{"identity":{"subject":"arn:aws:iam::000000000000:role/nobody","auth_type":"aws_iam"},"action":"llm.invoke"}' \
            | grep -q '"decision":"DENY"'

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs authz-ci

      - name: Stop container
        if: always()
        run: docker rm -f authz-ci

  deploy-dev:
    name: Deploy to dev
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_AUTHZ_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev-authz
          ecs-cluster: gateway-dev-authz-cluster
          ecs-service: gateway-dev-authz-service
          task-definition-family: gateway-dev-authz
