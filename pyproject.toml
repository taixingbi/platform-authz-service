[tool.poetry]
name = "bedrock-authz-service"
version = "0.1.0"
description = "Authorization service (PDP) for the Bedrock Gateway platform -- principal mapping + RBAC, called internally by bedrock-gateway-app"
authors = []
readme = "README.md"
packages = [{ include = "services" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115,<1.0"
pydantic = ">=2.0,<3.0"
uvicorn = ">=0.38,<1.0"
boto3 = ">=1.34,<2.0"
pyyaml = ">=6.0,<7.0"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1.0"
pytest = ">=7.4,<9.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
